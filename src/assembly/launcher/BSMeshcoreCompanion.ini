# Settings of the native launcher (BSMeshcoreCompanion.exe, BSMeshcoreCompanion), the same as in run.bat and run.sh.
# See https://github.com/jelinj8/Java-BSNative-launcher/blob/main/docs/ini.md
main-class=cz.bliksoft.meshcorecompanion.AppLauncher
classpath=config;app.jar;lib/*
min-java=21
jvm-option=--module-path=${APP_DIR}/lib
jvm-option=--add-modules=javafx.controls
jvm-option=-Djava.library.path=${APP_DIR}
jvm-option=-Djava.util.logging.manager=org.apache.logging.log4j.jul.LogManager
app-id=cz.bliksoft.BSMeshcoreCompanion
log-file=log/launcher.log
